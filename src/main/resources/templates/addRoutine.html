<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymApp</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
<header class="navbar">
    <div class="logo"><a href="/">Gym<span>App</span></a></div>
    <nav>
        <ul class="nav-links">
            <li><a href="/#popular-exercises">Exercises</a></li>
            <li><a href="/#featured-routines">Routines</a></li>
            <li><a href="/#personal-trainers">Personal Trainers</a></li>
            <li><a href="/#bmr-calculator">BMR Calculator</a></li>
        </ul>
    </nav>
</header>

<section class="routine-page">
    <div class="routine-form-wrapper">
        <div class="form-container">
            <div class="form-header">
                <p class="form-tag">GymApp routine manager</p>
                <h2>ADD NEW <span class="highlight">ROUTINE</span></h2>
                <p>Fill in the fields to register a new routine in the system.</p>
            </div>

            <form action="/routines/new" method="POST" class="gym-form">

                <div class="form-row">
                    <div class="form-group">
                        <label for="id">Routine ID</label>
                        <input type="text" id="id" name="id" placeholder="Ex: ROU-001" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Ex: Full Body Routine" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="5" placeholder="Explain the routine..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="difficulty">Difficulty</label>
                        <select id="difficulty" name="difficulty" required>
                            <option value="" disabled selected>Select difficulty...</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="imageUrl">Image URL</label>
                        <input type="text" id="imageUrl" name="imageUrl" placeholder="Optional: /images/routine.png">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="add-button">SAVE ROUTINE</button>
                    <a href="/" class="cancel-link">Back to home</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
