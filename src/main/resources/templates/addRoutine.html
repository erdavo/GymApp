<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymApp - Add Routine</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/form.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="navbar">
    <div class="logo"><a href="/">Gym<span>App</span></a></div>
    <nav>
        <ul class="nav-links">
            <li><a href="/#popular-exercises">Exercises</a></li>
            <li><a href="/#featured-routines">Routines</a></li>
            <li><a href="/#personal-trainers">Personal Trainers</a></li>
            <li><a href="/#bmr-calculator">BMR Calculator</a></li>
        </ul>
    </nav>
</header>

<section class="routine-page">
    <div class="routine-form-wrapper">
        <div class="form-container">
            <div class="form-header">
                <p class="form-tag">GymApp routine database</p>
                <h2>ADD NEW <span class="highlight">ROUTINE</span></h2>
                <p>Register a new routine with its main specifications.</p>
            </div>

            <form action="/routines/new" method="POST" class="gym-form">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Ex: Full Body Routine" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="5" placeholder="Explain the routine..."></textarea>
                </div>

                <div class="form-group">
                    <label for="difficulty">Difficulty</label>
                    <select id="difficulty" name="difficulty" required>
                        <option value="" disabled selected>Select difficulty...</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Select exercises</label>

                    <div class="search-bar routine-search-bar">
                        <input type="text" id="routineExerciseSearch" placeholder="Search exercise...">
                    </div>

                    <div class="filters routine-filters">
                        <button type="button" data-filter="all" class="active">All</button>
                        <button type="button" data-filter="Chest">Chest</button>
                        <button type="button" data-filter="Back">Back</button>
                        <button type="button" data-filter="Legs">Legs</button>
                        <button type="button" data-filter="Arms">Arms</button>
                        <button type="button" data-filter="Cardio">Cardio</button>
                        <button type="button" data-filter="Abs">Abs</button>
                    </div>

                    <div class="routine-exercise-grid">
                        {{#exercises}}
                        <label class="routine-exercise-card"
                               data-name="{{name}}"
                               data-muscle="{{muscleGroup}}">
                            <input type="checkbox" name="exerciseIds" value="{{id}}">
                            <img src="{{imageUrl}}" alt="{{name}}">
                            <div>
                                <h4>{{name}}</h4>
                                <p>{{muscleGroup}} · {{difficulty}}</p>
                            </div>
                        </label>
                        {{/exercises}}
                    </div>
                </div>

                <div class="form-group">
                    <label for="trainerId">Select trainer</label>
                    <select id="trainerId" name="trainerId" required>
                        <option value="" disabled selected>Select trainer...</option>
                        {{#trainers}}
                        <option value="{{id}}">{{name}} - {{email}}</option>
                        {{/trainers}}
                    </select>
                </div>


                <div class="form-actions">
                    <button type="submit" class="update-button">SAVE ROUTINE</button>
                    <a href="/#featured-routines" class="cancel-link">Back to home</a>
                </div>
            </form>
        </div>
    </div>
</section>
<script src="/js/search.js"></script>
</body>
</html>
