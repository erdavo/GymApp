<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymApp</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="navbar">
        <div class="logo"><a href="/">Gym<span>App</span></a></div>
        <nav>
            <ul class="nav-links">
                <li><a href="#popular-exercises">Exercises</a></li>
                <li><a href="#featured-routines">Routines</a></li>
                <li><a href="#personal-trainers">Personal Trainers</a></li>
            </ul>
        </nav>
    </header>
    <section class="section">
    <div class="form-container">
        <div class="form-header">
            <h2>ADD NEW <span class="highlight">EXERCISE</span></h2>
            <p>Fill in the fields to register a new exercise in the system.</p>
        </div>

        <form action="/exercises/new" method="POST" class="gym-form">
            
            <div class="form-row">
                <div class="form-group">
                    <label for="id">Exercise ID</label>
                    <input type="text" id="id" name="id" placeholder="Ex: EXE-001" required>
                </div>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Ex: Bench Press" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3" placeholder="Explain the exercise..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="muscleGroup">Muscle Group</label>
                    <select id="muscleGroup" name="muscleGroup" required>
                        <option value="" disabled selected>Select group...</option>
                        <option value="Chest">Chest</option>
                        <option value="Back">Back</option>
                        <option value="Legs">Legs</option>
                        <option value="Arms">Arms</option>
                        <option value="Abs">Abs</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="difficulty">Difficulty</label>
                    <select id="difficulty" name="difficulty" required>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="add-button">SAVE EXERCISE</button>
                <a href="/" class="cancel-link">Back to home</a>
            </div>
        </form>
    </div>
    </section>
</body>
</html>
