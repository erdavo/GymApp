# Application Name
spring.application.name=gymapp

# H2 Database configuration for file persistence
spring.datasource.url=jdbc:h2:file:./data/gymdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically create/update tables on startup
spring.jpa.hibernate.ddl-auto=update

# H2 Console configuration (available at localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Previous configuration settings
spring.mustache.suffix=.html
spring.mvc.hiddenmethod.filter.enabled=true

# Active profile 
spring.profiles.active=local